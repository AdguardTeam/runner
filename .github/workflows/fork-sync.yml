name: Fork sync

# Checks upstream (actions/runner) for a new *release* once a day.
# When one lands, merges it into a sync branch, bumps the fork version,
# verifies the fork patch set and opens a PR. Merging stays manual.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: : write   # upstream releases touch .github/workflows/*; pushing those needs this

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history - merge-base/git log need it
          persist-credentials: true

      - name: Sync with upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fork-sync.sh
